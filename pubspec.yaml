name: paseowof
description: "A new Flutter project."
publish_to: 'none'
version: 0.1.0

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter
  
  # Firebase
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  cloud_firestore: ^5.4.3
  firebase_messaging: ^15.1.3
  
  # State Management
  flutter_riverpod: ^2.6.1
  
  # Date formatting
  intl: ^0.19.0
  
  # PDF generation
  pdf: ^3.11.1
  printing: ^5.13.2
  path_provider: ^2.1.4
  share_plus: ^10.1.2
  
  # Local notifications
  flutter_local_notifications: ^18.0.1
  timezone: ^0.9.4

  # Ubicación y permisos (paseo en curso)
  geolocator: ^13.0.2
  permission_handler: ^11.3.1

  # Segundo plano solo mientras el GPS del paseo está activo
  flutter_background_service: ^5.0.5
  shared_preferences: ^2.2.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  
  assets:
    - images/
